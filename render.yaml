services:
  # Backend API service
  - type: web
    name: tryon-api
    runtime: python
    rootDir: apps/api
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tryon-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FAL_KEY
        sync: false
      - key: UPLOAD_DIR
        value: "uploads"

databases:
  # PostgreSQL Database
  - name: tryon-postgres
    databaseName: tryon_db
    user: postgres
    plan: free
