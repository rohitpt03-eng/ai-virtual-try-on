[project]
name = "ai-tryon-platform-api"
version = "0.1.0"
description = "AI Virtual Try-On Platform Backend API"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]<2.1",
    "asyncpg",
    "alembic",
    "celery",
    "redis",
    "mediapipe",
    "pillow",
    "opencv-python-headless",
    "fal-client",
    "playwright",
    "beautifulsoup4",
    "lxml",
    "pydantic-settings",
    "python-jose[cryptography]",
    "passlib[bcrypt]",
    "python-multipart",
    "httpx"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
